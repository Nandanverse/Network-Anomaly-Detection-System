name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check src/ tests/
          black --check src/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  model-validation:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          python scripts/generate_sample.py

      - name: Run ingestion
        run: |
          python -m src.ingestion.pcap_to_parquet

      - name: Build features
        run: python -m src.features.build_features

      - name: Train model
        run: python -m src.models.train

      - name: Validate model card
        run: |
          test -f src/models/model_card.md
          grep -q "Performance" src/models/model_card.md
          grep -q "MITRE ATT&CK" src/models/model_card.md

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Streamlit image
        run: docker build -f Dockerfile.streamlit -t ids-streamlit:test .

      - name: Test image runs
        run: |
          docker run --rm -d --name test-streamlit -p 8501:8501 ids-streamlit:test
          sleep 10
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop test-streamlit